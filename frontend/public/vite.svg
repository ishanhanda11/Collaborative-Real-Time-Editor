<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="collabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Code bracket: Left < -->
  <path d="M22 21L13 32L22 43" stroke="url(#codeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code bracket: Right > -->
  <path d="M42 21L51 32L42 43" stroke="url(#codeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Real-time Sync Cursor / Lightning Slash -->
  <path d="M35 18L27 34H35L29 46" stroke="url(#collabGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Real-time Connected User Presence Indicators (Live Dots) -->
  <circle cx="48" cy="16" r="3.5" fill="#10b981" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="53" cy="23" r="2" fill="#38bdf8" />
</svg>
